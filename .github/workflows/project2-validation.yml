name: Project 2 validation
on:
  pull_request:
    paths:
      - 'Data Analysis/Supply Chain and Logistics Performance Tracker/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Data Analysis/Supply Chain and Logistics Performance Tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy matplotlib pytest
      - run: pytest -q
