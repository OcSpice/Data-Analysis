name: Project 3 KPI Validation

on:
  push:
    branches:
      - main
      - rebuild-project3-kpi-engine
  pull_request:
    paths:
      - "Enterprise KPI Reporting Suite/**"
      - ".github/workflows/project3-validation.yml"

jobs:
  validate-project3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Enterprise KPI Reporting Suite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analytical tests
        run: pytest tests/test_pipeline.py -v

      - name: Run full pipeline
        run: python main.py
